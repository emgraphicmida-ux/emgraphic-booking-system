    <script>
      // Silently handle Vite dev HMR websocket in cloud preview environment
      (function() {
        if (typeof window === 'undefined') return;
        var OrigWS = window.WebSocket;
        if (!OrigWS) return;
        window.WebSocket = function(url, protocols) {
          if (
            protocols === 'vite-hmr' ||
            protocols === 'vite-ping' ||
            (typeof url === 'string' && (url.includes('vite-hmr') || url.includes('token=')))
          ) {
            var listeners = {};
            var fakeWs = {
              readyState: 1,
              send: function() {},
              close: function() {
                fakeWs.readyState = 3;
                if (listeners['close']) listeners['close'].forEach(function(fn) { fn({ wasClean: true }); });
              },
              addEventListener: function(event, handler) {
                listeners[event] = listeners[event] || [];
                listeners[event].push(handler);
                if (event === 'open') {
                  setTimeout(function() { handler({ type: 'open' }); }, 10);
                }
              },
              removeEventListener: function(event, handler) {
                if (!listeners[event]) return;
                listeners[event] = listeners[event].filter(function(h) { return h !== handler; });
              }
            };
            return fakeWs;
          }
          return new OrigWS(url, protocols);
        };
        window.WebSocket.prototype = OrigWS.prototype;
      })();
    </script>
    <title>Emgraphic Studio - Onlayn Çəkiliş Təqvimi və Bron Sistemi</title>
    <meta name="description" content="Emgraphic Studio üçün peşəkar onlayn çəkiliş təqvimi, dinamik saat kilidlənməsi, müştəri müraciət forması və inzibatçı (admin) idarəetmə paneli." />
